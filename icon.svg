<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%" fx="30%" fy="30%">
      <stop offset="0%" stop-color="#2c2824" />
      <stop offset="100%" stop-color="#141210" />
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8c88c" />
      <stop offset="50%" stop-color="#c59b4e" />
      <stop offset="100%" stop-color="#8b6826" />
    </linearGradient>
    <linearGradient id="paperGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#faf5e8" />
      <stop offset="100%" stop-color="#ebdcc0" />
    </linearGradient>
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Background container -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="106" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-opacity="0.4" />

  <!-- Sheet of paper sticking out from carriage -->
  <g filter="url(#subtleShadow)">
    <rect x="156" y="80" width="200" height="150" rx="6" fill="url(#paperGrad)" />
    <!-- Paper text lines -->
    <line x1="186" y1="115" x2="326" y2="115" stroke="#4a3e2e" stroke-width="3.5" stroke-linecap="round" stroke-opacity="0.75" />
    <line x1="186" y1="135" x2="300" y2="135" stroke="#4a3e2e" stroke-width="3.5" stroke-linecap="round" stroke-opacity="0.75" />
    <line x1="186" y1="155" x2="320" y2="155" stroke="#4a3e2e" stroke-width="3.5" stroke-linecap="round" stroke-opacity="0.75" />
    <line x1="186" y1="175" x2="250" y2="175" stroke="#b33927" stroke-width="3.5" stroke-linecap="round" stroke-opacity="0.9" />
  </g>

  <!-- Typewriter Platen Roller (Carriage Cylinder) -->
  <rect x="100" y="200" width="312" height="34" rx="10" fill="#1b1a18" stroke="#383632" stroke-width="3" />
  <!-- Roller knobs -->
  <rect x="76" y="205" width="24" height="24" rx="5" fill="url(#goldGrad)" />
  <rect x="412" y="205" width="24" height="24" rx="5" fill="url(#goldGrad)" />

  <!-- Typewriter Chassis / Main Body -->
  <g filter="url(#subtleShadow)">
    <path d="M 110 240 L 402 240 L 436 410 C 438 420, 428 430, 416 430 L 96 430 C 84 430, 74 420, 76 410 Z" fill="#201d1a" stroke="#3d3730" stroke-width="3.5" />
  </g>

  <!-- Typeguide & Ribbon Guide -->
  <polygon points="236,240 276,240 266,275 246,275" fill="url(#goldGrad)" />
  <circle cx="256" cy="285" r="5" fill="#e8c88c" />

  <!-- Typewriter Keyboard Deck -->
  <rect x="120" y="320" width="272" height="90" rx="8" fill="#151311" stroke="#2e2a25" stroke-width="2" />

  <!-- Round Typewriter Keys (Row 1) -->
  <circle cx="155" cy="342" r="11" fill="#2d2924" stroke="url(#goldGrad)" stroke-width="2" />
  <circle cx="189" cy="342" r="11" fill="#2d2924" stroke="url(#goldGrad)" stroke-width="2" />
  <circle cx="223" cy="342" r="11" fill="#2d2924" stroke="url(#goldGrad)" stroke-width="2" />
  <circle cx="256" cy="342" r="11" fill="#2d2924" stroke="url(#goldGrad)" stroke-width="2" />
  <circle cx="290" cy="342" r="11" fill="#2d2924" stroke="url(#goldGrad)" stroke-width="2" />
  <circle cx="323" cy="342" r="11" fill="#2d2924" stroke="url(#goldGrad)" stroke-width="2" />
  <circle cx="357" cy="342" r="11" fill="#2d2924" stroke="url(#goldGrad)" stroke-width="2" />

  <!-- Round Typewriter Keys (Row 2) -->
  <circle cx="170" cy="372" r="11" fill="#2d2924" stroke="url(#goldGrad)" stroke-width="2" />
  <circle cx="204" cy="372" r="11" fill="#2d2924" stroke="url(#goldGrad)" stroke-width="2" />
  <circle cx="238" cy="372" r="11" fill="#2d2924" stroke="url(#goldGrad)" stroke-width="2" />
  <circle cx="274" cy="372" r="11" fill="#2d2924" stroke="url(#goldGrad)" stroke-width="2" />
  <circle cx="308" cy="372" r="11" fill="#2d2924" stroke="url(#goldGrad)" stroke-width="2" />
  <circle cx="342" cy="372" r="11" fill="#2d2924" stroke="url(#goldGrad)" stroke-width="2" />

  <!-- Spacebar -->
  <rect x="180" y="396" width="152" height="10" rx="4" fill="#2d2924" stroke="url(#goldGrad)" stroke-width="2" />

  <!-- Brand Emblem on Front -->
  <text x="256" y="270" font-family="'Courier New', Courier, monospace" font-size="14" font-weight="bold" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="4">TYPEWRITER</text>
</svg>
