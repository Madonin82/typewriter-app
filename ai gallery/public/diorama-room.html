<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diorama Room</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0d0b09; }
  #scene { position: fixed; inset: 0; display: block; }
  .hud {
    position: fixed; top: 18px; left: 22px; color: #f2e8d8;
    font-family: Georgia, 'Times New Roman', serif; pointer-events: none;
    text-shadow: 0 2px 12px rgba(0,0,0,.7);
  }
  .hud h1 { margin: 0; font-size: 26px; font-weight: normal; letter-spacing: 1px; }
  .hud p { margin: 6px 0 0; font-size: 13px; font-style: italic; opacity: .65;
           font-family: system-ui, sans-serif; }
  .hint {
    position: fixed; bottom: 16px; left: 0; right: 0; text-align: center;
    color: #f2e8d8; opacity: .45; font: 12px system-ui, sans-serif;
    pointer-events: none; letter-spacing: .5px;
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<canvas id="scene"></canvas>
<div class="hud">
  <h1>Diorama Room</h1>
  <p>a shoebox interior</p>
</div>
<div class="hint">drag to look around &nbsp;·&nbsp; scroll to zoom</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ---------------------------------- setup ---------------------------------- */
const canvas = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0d0b09);
scene.fog = new THREE.Fog(0x0d0b09, 14, 26);

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 60);
camera.position.set(0.6, 2.5, 7.8);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.0, -0.2);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.enablePan = false;
controls.minDistance = 3.2;
controls.maxDistance = 11;
controls.minPolarAngle = 0.45;
controls.maxPolarAngle = Math.PI * 0.495;
controls.minAzimuthAngle = -1.15;
controls.maxAzimuthAngle = 1.15;

/* --------------------------------- helpers --------------------------------- */
function canvasTexture(draw, w = 256, h = 256, rx = 1, ry = 1) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(rx, ry);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = arr => arr[(Math.random() * arr.length) | 0];

function box(w, h, d, mat, x, y, z, ry = 0) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.position.set(x, y, z);
  m.rotation.y = ry;
  m.castShadow = true; m.receiveShadow = true;
  scene.add(m);
  return m;
}

/* --------------------------------- textures -------------------------------- */
const woodTex = canvasTexture((g, w, h) => {
  g.fillStyle = '#8a5a38'; g.fillRect(0, 0, w, h);
  for (let y = 0; y < h; y += 32) {
    g.fillStyle = 'rgba(0,0,0,.28)'; g.fillRect(0, y, w, 2);
    g.strokeStyle = 'rgba(60,35,20,.22)'; g.lineWidth = 1;
    for (let i = 0; i < 5; i++) {
      g.beginPath();
      const gy = y + 5 + Math.random() * 22;
      g.moveTo(0, gy); g.bezierCurveTo(80, gy + 3, 170, gy - 3, 256, gy); g.stroke();
    }
    g.fillStyle = 'rgba(0,0,0,.28)';
    g.fillRect(Math.random() * w, y, 2, 32);
  }
}, 256, 256, 2.5, 1.8);

const brickTex = canvasTexture((g, w, h) => {
  g.fillStyle = '#4c3a33'; g.fillRect(0, 0, w, h);
  const bh = 32, bw = 64;
  const pal = ['#7d4a3a', '#844f3d', '#75463a', '#8a5340'];
  for (let row = 0; row * bh < h; row++) {
    const off = (row % 2) * bw / 2;
    for (let x = -bw; x < w + bw; x += bw) {
      g.fillStyle = pick(pal);
      g.fillRect(x + off + 2, row * bh + 2, bw - 4, bh - 4);
    }
  }
}, 256, 256, 1.6, 1);

const artTex = canvasTexture((g, w, h) => {
  const grad = g.createLinearGradient(0, 0, 0, h);
  grad.addColorStop(0, '#2b3a5e'); grad.addColorStop(.55, '#b06a4a'); grad.addColorStop(1, '#e8a86a');
  g.fillStyle = grad; g.fillRect(0, 0, w, h);
  g.fillStyle = '#f4d9a0'; g.beginPath(); g.arc(w * .62, h * .58, 16, 0, 7); g.fill();
  g.fillStyle = '#1d2433';
  g.beginPath(); g.moveTo(0, h); g.lineTo(0, h * .72);
  g.quadraticCurveTo(w * .4, h * .6, w, h * .78); g.lineTo(w, h); g.fill();
}, 128, 160);

/* --------------------------------- materials ------------------------------- */
const plasterMat  = new THREE.MeshStandardMaterial({ color: 0xe6d9c2, roughness: .95 });
const ceilingMat  = new THREE.MeshStandardMaterial({ color: 0xf2e8d8, roughness: .95 });
const exteriorMat = new THREE.MeshStandardMaterial({ color: 0x4a3226, roughness: .85 });
const floorMat    = new THREE.MeshStandardMaterial({ map: woodTex, roughness: .7 });
const brickMat    = new THREE.MeshStandardMaterial({ map: brickTex, roughness: .9 });
const darkWoodMat = new THREE.MeshStandardMaterial({ color: 0x5a3d28, roughness: .7 });
const blackMat    = new THREE.MeshStandardMaterial({ color: 0x0a0a0a, roughness: 1 });
const stoneMat    = new THREE.MeshStandardMaterial({ color: 0x8d857c, roughness: .9 });
const trimMat     = new THREE.MeshStandardMaterial({ color: 0xd8c9b0, roughness: .9 });

/* ------------------------------- room shell -------------------------------- */
// Shoebox: floor, back wall, two side walls, ceiling. Front (+z) stays open.
const W = 6, D = 4, H = 3.4, T = 0.18;
// BoxGeometry material order: [+x, -x, +y, -y, +z, -z]

const floor = new THREE.Mesh(
  new THREE.BoxGeometry(W, T, D),
  [exteriorMat, exteriorMat, floorMat, exteriorMat, exteriorMat, exteriorMat]
);
floor.position.y = -T / 2;
floor.receiveShadow = true;
scene.add(floor);

const backWall = new THREE.Mesh(
  new THREE.BoxGeometry(W, H, T),
  [exteriorMat, exteriorMat, exteriorMat, exteriorMat, plasterMat, exteriorMat]
);
backWall.position.set(0, H / 2, -D / 2 - T / 2);
backWall.castShadow = backWall.receiveShadow = true;
scene.add(backWall);

const leftWall = new THREE.Mesh(
  new THREE.BoxGeometry(T, H, D),
  [plasterMat, exteriorMat, exteriorMat, exteriorMat, exteriorMat, exteriorMat]
);
leftWall.position.set(-W / 2 - T / 2, H / 2, 0);
leftWall.castShadow = leftWall.receiveShadow = true;
scene.add(leftWall);

const rightWall = new THREE.Mesh(
  new THREE.BoxGeometry(T, H, D),
  [exteriorMat, plasterMat, exteriorMat, exteriorMat, exteriorMat, exteriorMat]
);
rightWall.position.set(W / 2 + T / 2, H / 2, 0);
rightWall.castShadow = rightWall.receiveShadow = true;
scene.add(rightWall);

const ceiling = new THREE.Mesh(
  new THREE.BoxGeometry(W + T * 2, T, D + T * 2),
  [exteriorMat, exteriorMat, exteriorMat, ceilingMat, exteriorMat, exteriorMat]
);
ceiling.position.set(0, H + T / 2, -T / 2);
scene.add(ceiling);

// baseboards
box(W, 0.12, 0.03, trimMat, 0, 0.06, -D / 2 + 0.015);
box(0.03, 0.12, D, trimMat, -W / 2 + 0.015, 0.06, 0);
box(0.03, 0.12, D, trimMat,  W / 2 - 0.015, 0.06, 0);

/* --------------------------------- lights ---------------------------------- */
scene.add(new THREE.HemisphereLight(0xfff2e0, 0x3a2e26, 0.55));

const spill = new THREE.DirectionalLight(0xfff0dd, 0.75);
spill.position.set(4, 6.5, 7);
spill.castShadow = true;
spill.shadow.mapSize.set(2048, 2048);
spill.shadow.camera.left = -6; spill.shadow.camera.right = 6;
spill.shadow.camera.top = 6;   spill.shadow.camera.bottom = -4;
spill.shadow.camera.near = 1;  spill.shadow.camera.far = 25;
spill.shadow.bias = -0.0005;
spill.target.position.set(0, 0.8, -0.5);
scene.add(spill, spill.target);

const fireLight = new THREE.PointLight(0xff7733, 14, 9, 2);
fireLight.position.set(-1.4, 0.65, -1.15);
scene.add(fireLight);

const lampLight = new THREE.PointLight(0xffd9a0, 10, 7, 2);
lampLight.position.set(-2.5, 1.55, -1.0);
scene.add(lampLight);

/* -------------------------------- fireplace -------------------------------- */
const FP = { x: -1.4, z: -2 };                       // against back wall
box(1.6, 1.25, 0.5, brickMat, FP.x, 0.625, FP.z + 0.25);          // surround
box(0.9, 0.7, 0.34, blackMat, FP.x, 0.45, FP.z + 0.3);            // firebox
box(1.8, 0.09, 0.62, darkWoodMat, FP.x, 1.295, FP.z + 0.28);      // mantel
box(1.8, 0.06, 0.95, stoneMat, FP.x, 0.03, FP.z + 0.62);          // hearth

// logs
const logMat = new THREE.MeshStandardMaterial({ color: 0x3a2418, roughness: 1 });
for (let i = 0; i < 3; i++) {
  const log = new THREE.Mesh(new THREE.CylinderGeometry(0.055, 0.065, 0.7, 10), logMat);
  log.rotation.z = Math.PI / 2; log.rotation.y = rnd(-0.25, 0.25);
  log.position.set(FP.x + rnd(-0.06, 0.06), 0.16 + i * 0.07, FP.z + 0.3 + rnd(-0.04, 0.04));
  log.castShadow = true;
  scene.add(log);
}
// embers
const emberMat = new THREE.MeshBasicMaterial({ color: 0xff5a1a });
for (let i = 0; i < 6; i++) {
  const e = new THREE.Mesh(new THREE.SphereGeometry(0.022, 8, 8), emberMat);
  e.position.set(FP.x + rnd(-0.25, 0.25), 0.1, FP.z + 0.3 + rnd(-0.1, 0.1));
  scene.add(e);
}
// flames (animated)
const flames = [];
const flameCols = [0xff4d00, 0xff7b24, 0xffc93c];
for (let i = 0; i < 3; i++) {
  const f = new THREE.Mesh(
    new THREE.ConeGeometry(0.085 - i * 0.015, 0.34 - i * 0.05, 12),
    new THREE.MeshBasicMaterial({
      color: flameCols[i], transparent: true, opacity: 0.9,
      blending: THREE.AdditiveBlending, depthWrite: false
    })
  );
  f.position.set(FP.x + [-0.13, 0.04, 0.17][i], 0.42, FP.z + 0.3 + rnd(-0.03, 0.03));
  f.userData.phase = i * 2.1;
  scene.add(f);
  flames.push(f);
}
// framed picture above mantel
box(0.62, 0.78, 0.05, darkWoodMat, 0.35, 2.0, -D / 2 + 0.035);
const art = new THREE.Mesh(
  new THREE.PlaneGeometry(0.5, 0.66),
  new THREE.MeshStandardMaterial({ map: artTex, roughness: .9 })
);
art.position.set(0.35, 2.0, -D / 2 + 0.065);
scene.add(art);

/* -------------------------------- bookshelf -------------------------------- */
const SH = { x: 1.7, w: 1.3, h: 2.3, d: 0.36, z: -D / 2 + 0.18 };
const shelfMat = darkWoodMat;
box(0.05, SH.h, SH.d, shelfMat, SH.x - SH.w / 2, SH.h / 2, SH.z);
box(0.05, SH.h, SH.d, shelfMat, SH.x + SH.w / 2, SH.h / 2, SH.z);
box(SH.w, 0.05, SH.d, shelfMat, SH.x, SH.h - 0.025, SH.z);
box(SH.w, 0.06, SH.d, shelfMat, SH.x, 0.03, SH.z);
box(SH.w, 0.03, 0.02, shelfMat, SH.x, SH.h / 2, SH.z - SH.d / 2 + 0.01);
const shelfYs = [0.38, 0.78, 1.18, 1.58, 1.94];
for (const y of shelfYs) box(SH.w - 0.08, 0.04, SH.d - 0.04, shelfMat, SH.x, y, SH.z);

const bookCols = [0xa33b3b, 0x3b6ea3, 0x3ba368, 0xb0863b, 0x7a4a8a, 0xb0577a, 0x4a8a7d, 0x8a5a2e, 0x445566];
for (const y of shelfYs) {
  let x = SH.x - SH.w / 2 + 0.08;
  const xEnd = SH.x + SH.w / 2 - 0.08;
  while (x < xEnd - 0.04) {
    if (Math.random() < 0.08) { x += 0.07; continue; }            // gap
    if (Math.random() < 0.1) {                                    // flat stack
      const n = 2 + (Math.random() * 2 | 0);
      for (let s = 0; s < n; s++)
        box(0.24, 0.045, 0.17, new THREE.MeshStandardMaterial({ color: pick(bookCols), roughness: .85 }),
            x + 0.12, y + 0.045 + s * 0.048, SH.z, rnd(-0.06, 0.06));
      x += 0.3; continue;
    }
    const bw = rnd(0.035, 0.07), bh = rnd(0.26, 0.38);
    box(bw, bh, 0.2, new THREE.MeshStandardMaterial({ color: pick(bookCols), roughness: .85 }),
        x + bw / 2, y + 0.02 + bh / 2, SH.z, rnd(-0.02, 0.02));
    x += bw + 0.004;
  }
}

/* ------------------------------- armchair ---------------------------------- */
const chair = new THREE.Group();
const fabricMat = new THREE.MeshStandardMaterial({ color: 0x9a6a44, roughness: .95 });
const cushionMat = new THREE.MeshStandardMaterial({ color: 0xb08255, roughness: .95 });
function cbox(w, h, d, mat, x, y, z, rx = 0) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.position.set(x, y, z); m.rotation.x = rx;
  m.castShadow = m.receiveShadow = true;
  chair.add(m); return m;
}
cbox(0.62, 0.18, 0.58, fabricMat, 0, 0.42, 0);                 // seat
cbox(0.62, 0.62, 0.16, fabricMat, 0, 0.78, 0.26, -0.1);        // back
cbox(0.14, 0.3, 0.55, fabricMat, -0.38, 0.62, 0);              // arms
cbox(0.14, 0.3, 0.55, fabricMat,  0.38, 0.62, 0);
cbox(0.5, 0.1, 0.45, cushionMat, 0, 0.55, -0.02);              // cushion
for (const [lx, lz] of [[-0.28, -0.24], [0.28, -0.24], [-0.28, 0.24], [0.28, 0.24]]) {
  const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.025, 0.34, 10), darkWoodMat);
  leg.position.set(lx, 0.17, lz); leg.castShadow = true; chair.add(leg);
}
// throw blanket draped over the right arm
const blanketMat = new THREE.MeshStandardMaterial({ color: 0xc7a23a, roughness: 1 });
cbox(0.2, 0.035, 0.6, blanketMat, 0.38, 0.79, 0.02);
cbox(0.2, 0.34, 0.035, blanketMat, 0.38, 0.62, 0.31);
chair.position.set(-1.4, 0, 0.15);
chair.rotation.y = -0.28;                                      // angled toward fire + viewer
scene.add(chair);

/* -------------------------------- floor lamp ------------------------------- */
const lampMat = new THREE.MeshStandardMaterial({ color: 0x2e2a26, roughness: .5, metalness: .6 });
const lampBase = new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.18, 0.04, 20), lampMat);
lampBase.position.set(-2.5, 0.02, -1.0); lampBase.castShadow = true; scene.add(lampBase);
const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.022, 0.022, 1.5, 12), lampMat);
pole.position.set(-2.5, 0.79, -1.0); pole.castShadow = true; scene.add(pole);
const shade = new THREE.Mesh(
  new THREE.CylinderGeometry(0.17, 0.23, 0.3, 24, 1, true),
  new THREE.MeshStandardMaterial({ color: 0xf0dfc0, roughness: .9, side: THREE.DoubleSide,
                                   emissive: 0xffc98a, emissiveIntensity: 0.35 })
);
shade.position.set(-2.5, 1.66, -1.0); scene.add(shade);
const bulb = new THREE.Mesh(new THREE.SphereGeometry(0.045, 12, 12),
  new THREE.MeshBasicMaterial({ color: 0xffe2b0 }));
bulb.position.set(-2.5, 1.6, -1.0); scene.add(bulb);

/* ------------------------------- rug + table ------------------------------- */
const rugMat = new THREE.MeshStandardMaterial({ color: 0xa8512f, roughness: 1 });
const rug = new THREE.Mesh(new THREE.CircleGeometry(1.4, 40), rugMat);
rug.rotation.x = -Math.PI / 2; rug.position.set(-1.4, 0.012, -0.3);
rug.receiveShadow = true; scene.add(rug);
const rugIn = new THREE.Mesh(new THREE.CircleGeometry(1.05, 40),
  new THREE.MeshStandardMaterial({ color: 0xc07a4e, roughness: 1 }));
rugIn.rotation.x = -Math.PI / 2; rugIn.position.set(-1.4, 0.018, -0.3);
rugIn.receiveShadow = true; scene.add(rugIn);

const tableMat = darkWoodMat;
box(0.95, 0.05, 0.55, tableMat, -1.4, 0.38, -0.75);            // top
for (const [lx, lz] of [[-0.42, -0.22], [0.42, -0.22], [-0.42, 0.22], [0.42, 0.22]])
  box(0.05, 0.36, 0.05, tableMat, -1.4 + lx, 0.18, -0.75 + lz);
// stack of books on the table
let by = 0.43;
for (const [bw2, bd2] of [[0.34, 0.24], [0.3, 0.22], [0.26, 0.2]]) {
  box(bw2, 0.05, bd2, new THREE.MeshStandardMaterial({ color: pick(bookCols), roughness: .85 }),
      -1.55, by, -0.75, rnd(-0.15, 0.15));
  by += 0.052;
}
// mug
const mugMat = new THREE.MeshStandardMaterial({ color: 0xdad2c2, roughness: .6 });
const mug = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.045, 0.11, 20), mugMat);
mug.position.set(-1.15, 0.46, -0.68); mug.castShadow = true; scene.add(mug);
const handle = new THREE.Mesh(new THREE.TorusGeometry(0.035, 0.01, 10, 20), mugMat);
handle.position.set(-1.095, 0.46, -0.68); scene.add(handle);
const coffee = new THREE.Mesh(new THREE.CircleGeometry(0.042, 20),
  new THREE.MeshStandardMaterial({ color: 0x2e1c10, roughness: .4 }));
coffee.rotation.x = -Math.PI / 2; coffee.position.set(-1.15, 0.515, -0.68); scene.add(coffee);

/* -------------------------------- dust motes ------------------------------- */
const MOTES = 120;
const moteGeo = new THREE.BufferGeometry();
const moteBase = new Float32Array(MOTES * 3);
const motePhase = new Float32Array(MOTES);
for (let i = 0; i < MOTES; i++) {
  moteBase[i * 3]     = rnd(-2.8, 2.8);
  moteBase[i * 3 + 1] = rnd(0.2, 3.0);
  moteBase[i * 3 + 2] = rnd(-1.8, 1.8);
  motePhase[i] = rnd(0, Math.PI * 2);
}
moteGeo.setAttribute('position', new THREE.BufferAttribute(moteBase.slice(), 3));
const motes = new THREE.Points(moteGeo, new THREE.PointsMaterial({
  color: 0xffe0b0, size: 0.016, transparent: true, opacity: 0.35, depthWrite: false
}));
scene.add(motes);

/* ---------------------------------- animate -------------------------------- */
const clock = new THREE.Clock();
function tick() {
  requestAnimationFrame(tick);
  const t = clock.getElapsedTime();

  // fire flicker
  fireLight.intensity = 14 + Math.sin(t * 11) * 1.8 + Math.sin(t * 23 + 1.7) * 1.2
                      + (Math.random() - 0.5) * 0.9;
  for (const f of flames) {
    const s = Math.sin(t * 13 + f.userData.phase);
    f.scale.set(1 - 0.14 * s, 1 + 0.28 * s, 1 - 0.14 * s);
    f.position.x += Math.sin(t * 7 + f.userData.phase) * 0.0006;
  }
  // drifting dust
  const p = moteGeo.attributes.position.array;
  for (let i = 0; i < MOTES; i++) {
    p[i * 3]     = moteBase[i * 3] + Math.sin(t * 0.22 + motePhase[i]) * 0.18;
    p[i * 3 + 1] = moteBase[i * 3 + 1] + Math.sin(t * 0.16 + motePhase[i] * 1.7) * 0.14;
  }
  moteGeo.attributes.position.needsUpdate = true;

  controls.update();
  renderer.render(scene, camera);
}
tick();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
