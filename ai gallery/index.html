<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Art Gallery</title>
    <meta name="description" content="Interactive 3D Art Wall and Museum Gallery built with Three.js and CSS3DRenderer.">
    <meta property="og:title" content="3D Art Gallery">
    <meta property="og:description" content="Interactive 3D Art Wall and Museum Gallery built with Three.js and CSS3DRenderer.">
    <!-- Tailwind CSS for UI overlays -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Inter Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
            background-color: #121212;
            user-select: none;
            -webkit-user-select: none;
        }

        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        #css-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none; /* Let clicks pass through unless over interactive iframe elements */
        }

        .css3d-object {
            pointer-events: auto;
            transition: opacity 0.3s ease;
        }

        /* Custom scrollbar / UI overlays styling */
        .ui-layer {
            position: absolute;
            z-index: 10;
            pointer-events: none;
        }
        .interactive-ui {
            pointer-events: auto;
        }
    </style>
</head>
<body class="bg-zinc-950 text-zinc-100 antialiased">

    <div class="ui-layer top-0 left-0 w-full p-6 flex justify-between items-start pointer-events-none">
        <div class="interactive-ui bg-zinc-900/80 backdrop-blur-md border border-zinc-800/80 px-5 py-3 rounded-2xl shadow-2xl">
            <h1 class="text-sm font-semibold tracking-wider uppercase text-amber-500/90">Gallery <span class="text-xs bg-amber-500/20 text-amber-300 px-2 py-0.5 rounded-full ml-1">Beta</span></h1>
            <p class="text-xs text-zinc-400 mt-0.5">Interactive 3D Art Wall • Drag or scroll horizontally to explore</p>
        </div>
        <div class="interactive-ui flex items-center gap-3">
            <button onclick="resetCamera()" class="bg-zinc-900/80 hover:bg-zinc-800 border border-zinc-800/80 text-zinc-300 px-4 py-2.5 rounded-xl text-xs font-medium transition shadow-lg flex items-center gap-2">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
                Return to Start
            </button>
        </div>
    </div>

    <div id="loader" class="absolute inset-0 z-50 bg-zinc-950 flex flex-col items-center justify-center transition-opacity duration-700">
        <div class="w-12 h-12 border-4 border-amber-500/20 border-t-amber-500 rounded-full animate-spin mb-4"></div>
        <p class="text-sm font-medium tracking-wide text-zinc-400">Loading 3D Museum Space...</p>
    </div>

    <div id="canvas-container"></div>
    <div id="css-container"></div>

    <!-- Three.js and CSS3DRenderer CDN scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/renderers/CSS3DRenderer.js"></script>

    <script>
        const ARTWORKS = [
            {
                id: 'art-1',
                title: 'Diorama Room',
                artist: 'Annie',
                type: 'html',
                url: 'public/diorama-room.html'
            },
            {
                id: 'art-2',
                title: 'Night Nook',
                artist: 'Jessika',
                type: 'html',
                url: 'public/Night Nook.html'
            },
            {
                id: 'art-3',
                title: 'Night Nook 3D',
                artist: 'Jessika',
                type: 'html',
                url: 'public/Night Nook 3D.html'
            },
            {
                id: 'art-4',
                title: 'Composition Study',
                artist: 'Gallery Archive',
                type: 'image',
                url: 'public/527ea5ef-5a3c-46c7-b2d1-a542186f901e.jpg'
            }
        ];

        let scene, camera, webGLRenderer, cssRenderer;
        let galleryWidth = 0;
        let targetCameraX = 0;
        let currentCameraX = 0;
        let targetCameraZ = 2.93;
        let currentCameraZ = 2.93;
        const frameObjects = [];
        
        // Interaction control variables
        let isDragging = false;
        let previousMouseX = 0;
        let touchStartX = 0;

        const spacingX = 6.5; // Distance between frames
        const startXOffset = -((ARTWORKS.length - 1) * spacingX) / 2;

        function initGallery() {
            const containerWebGL = document.getElementById('canvas-container');
            const containerCSS = document.getElementById('css-container');

            // Scene setup
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0e0e10);
            scene.fog = new THREE.FogExp2(0x0e0e10, 0.035);

            // Camera setup
            camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 0, 2.93);

            // WebGL Renderer
            webGLRenderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
            webGLRenderer.setSize(window.innerWidth, window.innerHeight);
            webGLRenderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            webGLRenderer.shadowMap.enabled = true;
            webGLRenderer.shadowMap.type = THREE.PCFSoftShadowMap;
            webGLRenderer.toneMapping = THREE.ACESFilmicToneMapping;
            containerWebGL.appendChild(webGLRenderer.domElement);

            // CSS3D Renderer
            cssRenderer = new THREE.CSS3DRenderer();
            cssRenderer.setSize(window.innerWidth, window.innerHeight);
            containerCSS.appendChild(cssRenderer.domElement);

            // Build Museum Architecture
            buildMuseumRoom();

            // Build Frames & Artworks
            buildArtworks();

            // Setup Navigation Event Listeners
            setupInteractions();

            // Hide Loader
            setTimeout(() => {
                const loader = document.getElementById('loader');
                loader.style.opacity = '0';
                setTimeout(() => loader.remove(), 700);
            }, 500);

            // Start Render Loop
            window.addEventListener('resize', onWindowResize);
            animate();
        }

        function buildMuseumRoom() {
            galleryWidth = (ARTWORKS.length + 1) * spacingX;

            // Ambient Museum Lighting
            const ambientLight = new THREE.AmbientLight(0xfff5e6, 0.35);
            scene.add(ambientLight);

            const directionalLight = new THREE.DirectionalLight(0xffeedd, 0.5);
            directionalLight.position.set(0, 10, 5);
            scene.add(directionalLight);

            // Gallery Main Wall (Warm off-white plaster)
            const wallGeometry = new THREE.PlaneGeometry(galleryWidth + 15, 8);
            const wallMaterial = new THREE.MeshStandardMaterial({
                color: 0xf3f0ea,
                roughness: 0.9,
                metalness: 0.05
            });
            const backWall = new THREE.Mesh(wallGeometry, wallMaterial);
            backWall.position.set(0, 0, -2.1);
            scene.add(backWall);

            // Dark Wood Floor with soft roughness
            const floorGeometry = new THREE.PlaneGeometry(galleryWidth + 15, 15);
            const floorMaterial = new THREE.MeshStandardMaterial({
                color: 0x1c1714,
                roughness: 0.4,
                metalness: 0.2
            });
            const floor = new THREE.Mesh(floorGeometry, floorMaterial);
            floor.rotation.x = -Math.PI / 2;
            floor.position.set(0, -3.5, 2.5);
            floor.receiveShadow = true;
            scene.add(floor);

            // Ceiling
            const ceilingGeometry = new THREE.PlaneGeometry(galleryWidth + 15, 15);
            const ceilingMaterial = new THREE.MeshStandardMaterial({
                color: 0x111113,
                roughness: 0.9
            });
            const ceiling = new THREE.Mesh(ceilingGeometry, ceilingMaterial);
            ceiling.rotation.x = Math.PI / 2;
            ceiling.position.set(0, 4.5, 2.5);
            scene.add(ceiling);
        }

        function buildArtworks() {
            ARTWORKS.forEach((art, index) => {
                const xPos = startXOffset + (index * spacingX);
                const frameGroup = new THREE.Group();
                frameGroup.position.set(xPos, 0, -2);

                // 1. Physical 3D Frame (Molding box around artwork rect: width 3.2, height 2.2)
                const frameWidth = 3.3;
                const frameHeight = 2.3;
                const frameDepth = 0.15;

                const frameBoxGeo = new THREE.BoxGeometry(frameWidth, frameHeight, frameDepth);
                const frameMaterial = new THREE.MeshStandardMaterial({
                    color: 0x27272a,
                    roughness: 0.3,
                    metalness: 0.8
                });
                const frameMesh = new THREE.Mesh(frameBoxGeo, frameMaterial);
                frameMesh.position.set(0, 0, -0.05);
                frameGroup.add(frameMesh);

                // Inner backing recess
                const innerGeo = new THREE.PlaneGeometry(3.0, 2.0);
                const innerMat = new THREE.MeshBasicMaterial({ color: 0x09090b });
                const innerMesh = new THREE.Mesh(innerGeo, innerMat);
                innerMesh.position.set(0, 0, 0.02);
                frameGroup.add(innerMesh);

                // 2. CSS3D Iframe / Artwork Object (Lazy Loaded state management)
                const cssObject = createCSSArtworkElement(art);
                cssObject.position.set(0, 0, 0.05);
                // Scale down CSS3D element to match Three.js world units (approx factor 0.005 for 800px width container)
                cssObject.scale.set(0.0042, 0.0042, 0.0042);
                frameGroup.add(cssObject);

                // 3. Warm Museum Spotlight per frame
                const spotLight = new THREE.SpotLight(0xfffaed, 1.8);
                spotLight.position.set(xPos, 3.8, 2.5);
                spotLight.target = innerMesh;
                spotLight.angle = Math.PI / 5;
                spotLight.penumbra = 0.6;
                scene.add(spotLight);

                // 4. Placard under each frame (Canvas Texture on small plane)
                const placardMesh = createPlacardMesh(art.title, art.artist);
                placardMesh.position.set(0, -1.45, 0.05);
                frameGroup.add(placardMesh);

                scene.add(frameGroup);

                // Store reference for viewport culling / lazy evaluation if needed
                frameObjects.push({
                    group: frameGroup,
                    x: xPos,
                    cssObject: cssObject,
                    loaded: true
                });
            });
        }

        function createPlacardMesh(title, artist) {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 256;
            const ctx = canvas.getContext('2d');

            // Placard plaque background
            ctx.fillStyle = '#fbfbfa';
            ctx.fillRect(0, 0, 512, 256);

            // Border stroke
            ctx.strokeStyle = '#d4d4d8';
            ctx.lineWidth = 8;
            ctx.strokeRect(10, 10, 492, 236);

            // Text formatting
            ctx.fillStyle = '#18181b';
            ctx.font = 'bold 36px "Inter", sans-serif';
            ctx.fillText(title, 36, 85);

            ctx.fillStyle = '#71717a';
            ctx.font = '28px "Inter", sans-serif';
            ctx.fillText(artist, 36, 135);

            ctx.fillStyle = '#a1a1aa';
            ctx.font = 'italic 20px "Inter", sans-serif';
            ctx.fillText('Mixed Media Digital Art, 2026', 36, 185);

            const texture = new THREE.CanvasTexture(canvas);
            const planeGeo = new THREE.PlaneGeometry(0.75, 0.375);
            const planeMat = new THREE.MeshBasicMaterial({ map: texture });
            return new THREE.Mesh(planeGeo, planeMat);
        }

        function createCSSArtworkElement(art) {
            const div = document.createElement('div');
            div.className = 'css3d-object';
            div.style.width = '720px';
            div.style.height = '480px';
            div.style.background = '#09090b';
            div.style.borderRadius = '4px';
            div.style.overflow = 'hidden';
            div.style.boxShadow = '0 20px 25px -5px rgba(0, 0, 0, 0.5)';

            if (art.type === 'image') {
                const img = document.createElement('img');
                img.src = art.url;
                img.style.width = '100%';
                img.style.height = '100%';
                img.style.objectFit = 'cover';
                div.appendChild(img);
            } else {
                const iframe = document.createElement('iframe');
                iframe.src = art.url;
                iframe.style.width = '100%';
                iframe.style.height = '100%';
                iframe.style.border = 'none';
                iframe.style.background = '#0d0b09';
                div.appendChild(iframe);
            }

            const cssObject = new THREE.CSS3DObject(div);
            return cssObject;
        }

        function setupInteractions() {
            window.addEventListener('mousedown', (e) => {
                // Ignore UI buttons
                if (e.target.tagName === 'BUTTON' || e.target.closest('.interactive-ui')) return;
                isDragging = true;
                previousMouseX = e.clientX;
            });

            window.addEventListener('mousemove', (e) => {
                if (!isDragging) return;
                const deltaX = e.clientX - previousMouseX;
                previousMouseX = e.clientX;

                targetCameraX -= deltaX * 0.012;
                clampCameraX();
            });

            window.addEventListener('mouseup', () => {
                isDragging = false;
            });

            // Touch support
            window.addEventListener('touchstart', (e) => {
                if (e.target.tagName === 'BUTTON' || e.target.closest('.interactive-ui')) return;
                isDragging = true;
                touchStartX = e.touches[0].clientX;
            });

            window.addEventListener('touchmove', (e) => {
                if (!isDragging) return;
                const currentX = e.touches[0].clientX;
                const deltaX = currentX - touchStartX;
                touchStartX = currentX;

                targetCameraX -= deltaX * 0.015;
                clampCameraX();
            });

            window.addEventListener('touchend', () => {
                isDragging = false;
            });

            // Mouse scroll zoom in and out
            window.addEventListener('wheel', (e) => {
                targetCameraZ += e.deltaY * 0.003;
                targetCameraZ = Math.max(1.5, Math.min(7.0, targetCameraZ));
            }, { passive: true });
        }

        function clampCameraX() {
            const minX = startXOffset - 1.5;
            const maxX = startXOffset + ((ARTWORKS.length - 1) * spacingX) + 1.5;
            targetCameraX = Math.max(minX, Math.min(maxX, targetCameraX));
        }

        function resetCamera() {
            targetCameraX = 0;
            targetCameraZ = 2.93;
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            webGLRenderer.setSize(window.innerWidth, window.innerHeight);
            cssRenderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            // Smooth damping (lerp) towards target camera position (X and Z)
            currentCameraX += (targetCameraX - currentCameraX) * 0.08;
            currentCameraZ += (targetCameraZ - currentCameraZ) * 0.08;
            camera.position.x = currentCameraX;
            camera.position.z = currentCameraZ;

            // Render both WebGL room and CSS3D art pieces synchronously
            webGLRenderer.render(scene, camera);
            cssRenderer.render(scene, camera);
        }

        // Initialize gallery on window load
        window.onload = initGallery;
    </script>
</body>
</html>
