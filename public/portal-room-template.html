<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portal Room Template — 3D Art Gallery</title>
  <meta name="description" content="Official starter template for standalone 3D portal rooms companion to wall exhibits.">
  
  <style>
    /* -------------------------------------------------------------------------- */
    /* ARCHITECTURAL & SCENE STYLES                                               */
    /* -------------------------------------------------------------------------- */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0d0b09;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }

    #scene-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      outline: none;
    }

    /* -------------------------------------------------------------------------- */
    /* FADE-IN-FROM-BLACK OVERLAY (Rule 2)                                        */
    /* Pairs with the gallery's 600ms fade-to-black on doorway entry.              */
    /* Starts opaque black, fades out once the first 3D frame has rendered.      */
    /* -------------------------------------------------------------------------- */
    #fade-overlay {
      position: fixed;
      inset: 0;
      background-color: #000000;
      z-index: 1000;
      pointer-events: none;
      opacity: 1;
      transition: opacity 800ms ease-out;
    }

    #fade-overlay.loaded {
      opacity: 0;
    }

    /* -------------------------------------------------------------------------- */
    /* FIXED "BACK TO GALLERY" CONTROL (Rule 3)                                   */
    /* Reads the 'return' query parameter supplied by the gallery doorway.       */
    /* Validates origin to avoid open redirects; falls back safely to gallery.    */
    /* -------------------------------------------------------------------------- */
    .nav-back-button {
      position: fixed;
      top: 18px;
      left: 20px;
      z-index: 50;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      background: rgba(20, 18, 16, 0.75);
      color: #ede8df;
      border: 1px solid rgba(212, 197, 180, 0.25);
      border-radius: 9999px;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.02em;
      text-decoration: none;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .nav-back-button:hover {
      background: rgba(35, 30, 26, 0.9);
      border-color: rgba(217, 119, 6, 0.6);
      color: #fbbf24;
      transform: translateY(-1px);
    }

    .nav-back-button svg {
      width: 14px;
      height: 14px;
      stroke-width: 2.2;
    }

    /* -------------------------------------------------------------------------- */
    /* IN-SCENE HINTS & PLACARD (Non-blocking)                                    */
    /* -------------------------------------------------------------------------- */
    .room-header {
      position: fixed;
      top: 18px;
      right: 20px;
      text-align: right;
      z-index: 40;
      pointer-events: none;
      color: #f3efe6;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8);
    }

    .room-header h1 {
      margin: 0;
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 0.04em;
    }

    .room-header p {
      margin: 4px 0 0;
      font-size: 11px;
      color: #a8a29e;
      font-style: italic;
    }

    .interaction-hint {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 40;
      pointer-events: none;
      background: rgba(15, 14, 13, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: #d6d3d1;
      padding: 6px 16px;
      border-radius: 9999px;
      font-size: 11px;
      backdrop-filter: blur(8px);
      letter-spacing: 0.03em;
      transition: opacity 1.5s ease-out;
    }

    .interaction-hint.fade-out {
      opacity: 0;
    }
  </style>

  <!-- Import Three.js via ES Modules -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>

  <!-- Fullscreen WebGL canvas -->
  <canvas id="scene-canvas"></canvas>

  <!-- 
    ============================================================================
    PORTAL ROOM DESIGN RULES & GUIDELINES FOR ARTISTS:
    ============================================================================
    1. NO GREETING / NO TITLE SCREEN / NO CLICK-TO-ENTER:
       First paint is the 3D scene immediately. The wall piece in the 3D Art Gallery
       was the entrance; guests already chose to step inside. Blocking overlays or
       interstitials are prohibited.

    2. FADE-IN-FROM-BLACK:
       #fade-overlay starts opaque black and smoothly transitions to transparent 
       once the first frame is rendered (~800ms).

    3. RETURN TRIP CONTROL:
       The "← Back to gallery" button below reads the `return` query parameter 
       provided by the gallery (e.g. `gallery.html#exhibit=<docId>`), validates the
       safe gallery URL prefix, and returns the visitor directly to the exact wall piece.
       Artists never hardcode gallery addresses or exhibit IDs!

    4. ?entered=1 PARAMETER:
       The gallery passes `?entered=1` for backwards-compatibility with older rooms.
       New rooms built from this template do not need to inspect it.

    5. LOD (LEVEL OF DETAIL) ARCHITECTURE:
       Recommended pattern: Write one scene generator that accepts a `detail` switch
       (e.g., `isWallDiorama ? lowLOD : fullLOD`). Use the lightweight version inside
       the gallery frame and the rich, full-scale scene inside this standalone room.
    ============================================================================
  -->

  <!-- Back to Gallery link (Dynamic, safe return) -->
  <a id="btn-back-to-gallery" href="https://madonin82.github.io/typewriter-app/gallery.html" class="nav-back-button" aria-label="Return to gallery">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
    </svg>
    <span>Back to Gallery</span>
  </a>

  <!-- In-scene header & hints -->
  <div class="room-header">
    <h1 id="room-title">The Companion Room</h1>
    <p id="room-subtitle">Step into the work</p>
  </div>

  <div id="room-hint" class="interaction-hint">
    Drag to look &nbsp;&middot;&nbsp; Scroll to zoom &nbsp;&middot;&nbsp; WASD / Arrows to stroll
  </div>

  <!-- Fade-in overlay -->
  <div id="fade-overlay"></div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    /* -------------------------------------------------------------------------- */
    /* 1. SAFE RETURN URL RESOLUTION (Rule 3)                                     */
    /* -------------------------------------------------------------------------- */
    const TRUSTED_GALLERY_PREFIX = 'https://madonin82.github.io/typewriter-app/gallery.html';
    const FALLBACK_GALLERY_URL = 'https://madonin82.github.io/typewriter-app/gallery.html';

    function getValidatedReturnUrl() {
      try {
        const params = new URLSearchParams(window.location.search);
        const returnParam = params.get('return');
        if (returnParam) {
          const decoded = decodeURIComponent(returnParam);
          // Only allow return navigation to our trusted gallery URL
          if (decoded.startsWith(TRUSTED_GALLERY_PREFIX)) {
            return decoded;
          }
          // Also allow relative or local test returns if on dev
          if ((location.hostname === 'localhost' || location.hostname === '127.0.0.1') && decoded.includes('gallery.html')) {
            return decoded;
          }
        }
      } catch (e) {
        console.warn('Invalid return URL parameter:', e);
      }
      return FALLBACK_GALLERY_URL;
    }

    const backButton = document.getElementById('btn-back-to-gallery');
    if (backButton) {
      backButton.href = getValidatedReturnUrl();
    }

    /* -------------------------------------------------------------------------- */
    /* 2. THREE.JS SCENE SETUP                                                    */
    /* -------------------------------------------------------------------------- */
    const canvas = document.getElementById('scene-canvas');
    const renderer = new THREE.WebGLRenderer({
      canvas,
      antialias: true,
      powerPreference: 'high-performance'
    });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.1;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0e0d0b);
    scene.fog = new THREE.FogExp2(0x0e0d0b, 0.04);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 1.8, 6.0);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 1.2, 0);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.minDistance = 1.5;
    controls.maxDistance = 15;
    controls.maxPolarAngle = Math.PI / 2 - 0.02; // Keep camera above floor

    /* -------------------------------------------------------------------------- */
    /* 3. LIGHTING & ENVIRONMENT                                                  */
    /* -------------------------------------------------------------------------- */
    const ambientLight = new THREE.AmbientLight(0xffeedd, 0.6);
    scene.add(ambientLight);

    const warmSpot = new THREE.SpotLight(0xffd59e, 2.5);
    warmSpot.position.set(2, 5, 3);
    warmSpot.angle = Math.PI / 4;
    warmSpot.penumbra = 0.5;
    warmSpot.castShadow = true;
    scene.add(warmSpot);

    const coolFill = new THREE.DirectionalLight(0x8bc34a, 0.4);
    coolFill.position.set(-3, 3, -2);
    scene.add(coolFill);

    /* -------------------------------------------------------------------------- */
    /* 4. PROCEDURAL ROOM GEOMETRY (Replace with your custom artwork/models)       */
    /* -------------------------------------------------------------------------- */
    // Floor
    const floorGeo = new THREE.PlaneGeometry(20, 20);
    const floorMat = new THREE.MeshStandardMaterial({
      color: 0x181614,
      roughness: 0.6,
      metalness: 0.1
    });
    const floorMesh = new THREE.Mesh(floorGeo, floorMat);
    floorMesh.rotation.x = -Math.PI / 2;
    floorMesh.receiveShadow = true;
    scene.add(floorMesh);

    // Central Artifact / Sculpture
    const artifactGeo = new THREE.IcosahedronGeometry(0.9, 1);
    const artifactMat = new THREE.MeshStandardMaterial({
      color: 0xd97706,
      roughness: 0.25,
      metalness: 0.85
    });
    const artifactMesh = new THREE.Mesh(artifactGeo, artifactMat);
    artifactMesh.position.set(0, 1.4, 0);
    artifactMesh.castShadow = true;
    artifactMesh.receiveShadow = true;
    scene.add(artifactMesh);

    // Pedestal
    const pedestalGeo = new THREE.CylinderGeometry(0.6, 0.7, 0.9, 32);
    const pedestalMat = new THREE.MeshStandardMaterial({
      color: 0x242220,
      roughness: 0.9
    });
    const pedestalMesh = new THREE.Mesh(pedestalGeo, pedestalMat);
    pedestalMesh.position.set(0, 0.45, 0);
    pedestalMesh.receiveShadow = true;
    scene.add(pedestalMesh);

    /* -------------------------------------------------------------------------- */
    /* 5. RESIZE & ANIMATION LOOP                                                 */
    /* -------------------------------------------------------------------------- */
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    let firstFrameRendered = false;
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);

      const delta = clock.getDelta();
      artifactMesh.rotation.y += delta * 0.4;
      artifactMesh.rotation.x += delta * 0.15;

      controls.update();
      renderer.render(scene, camera);

      // Trigger fade-in from black once the first real frame is drawn (Rule 2)
      if (!firstFrameRendered) {
        firstFrameRendered = true;
        requestAnimationFrame(() => {
          const fadeEl = document.getElementById('fade-overlay');
          if (fadeEl) fadeEl.classList.add('loaded');
        });
      }
    }

    animate();

    // Auto-fade the interaction hint pill after 5 seconds
    setTimeout(() => {
      const hint = document.getElementById('room-hint');
      if (hint) hint.classList.add('fade-out');
    }, 5000);
  </script>
</body>
</html>
