<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <link rel="icon" href="data:," />
  <title>Night Nook</title>
  <style>
    :root {
      color-scheme: light dark;
      --ink: #1b1f2d;
      --muted: #626879;
      --panel: rgba(244, 238, 225, .93);
      --panel-strong: #f5efe3;
      --line: rgba(27, 31, 45, .16);
      --accent: #a64b34;
      --accent-ink: #fff8ed;
      --shadow: rgba(39, 27, 28, .22);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --ink: #f1e9db;
        --muted: #aaa6a8;
        --panel: rgba(24, 27, 39, .92);
        --panel-strong: #1b1e2a;
        --line: rgba(241, 233, 219, .16);
        --accent: #df8b5d;
        --accent-ink: #21130f;
        --shadow: rgba(0, 0, 0, .42);
      }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #080b15; }
    body {
      font-family: "Avenir Next", Avenir, "Segoe UI", sans-serif;
      color: var(--ink);
      overscroll-behavior: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
    .grain {
      position: fixed; inset: 0; pointer-events: none; opacity: .09; mix-blend-mode: soft-light;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 120 120' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.55'/%3E%3C/svg%3E");
    }
    .top-note {
      position: fixed; top: max(18px, env(safe-area-inset-top)); left: clamp(18px, 4vw, 52px);
      max-width: min(470px, calc(100vw - 36px)); color: #f4ebdf; text-shadow: 0 2px 16px rgba(0,0,0,.62);
      pointer-events: none;
    }
    .time { margin: 0 0 7px; font: 600 11px/1.2 ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .14em; opacity: .68; }
    .thought { margin: 0; font-family: Georgia, "Times New Roman", serif; font-size: clamp(20px, 2.8vw, 32px); font-weight: 400; line-height: 1.15; }
    .thought span { display: block; font-size: .58em; margin-top: 7px; font-style: italic; opacity: .72; }
    .controls {
      position: fixed; left: 50%; bottom: max(18px, env(safe-area-inset-bottom)); transform: translateX(-50%);
      display: flex; align-items: center; gap: 8px; width: max-content; max-width: calc(100vw - 24px);
      padding: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--ink);
      box-shadow: 0 12px 35px var(--shadow); border-radius: 16px;
    }
    button {
      appearance: none; border: 0; color: inherit; background: transparent; min-height: 42px; padding: 0 14px;
      border-radius: 10px; font: 650 13px/1 "Avenir Next", Avenir, "Segoe UI", sans-serif; cursor: pointer;
      display: inline-flex; align-items: center; gap: 8px; white-space: nowrap;
    }
    button:hover { background: color-mix(in srgb, var(--panel-strong) 72%, var(--ink) 8%); }
    button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
    .glyph { width: 17px; height: 17px; display: block; }
    .divider { width: 1px; height: 24px; background: var(--line); }
    .hint {
      position: fixed; right: clamp(18px, 3vw, 38px); top: max(22px, env(safe-area-inset-top));
      color: #f4ebdf; font: 500 11px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
      opacity: .56; text-align: right; pointer-events: none;
    }
    .toast {
      position: fixed; left: 50%; bottom: 86px; transform: translate(-50%, 8px); opacity: 0;
      background: var(--panel-strong); border: 1px solid var(--line); color: var(--ink); padding: 9px 13px;
      border-radius: 9px; font-size: 12px; box-shadow: 0 8px 22px var(--shadow); pointer-events: none;
      transition: opacity .2s ease, transform .2s ease;
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }
    .fallback {
      position: fixed; inset: 0; display: none; place-items: center; padding: 30px; background: #101423; color: #f4ebdf;
      text-align: center; font: 18px/1.5 Georgia, serif;
    }
    @media (max-width: 620px) {
      .hint { display: none; }
      .top-note { top: max(16px, env(safe-area-inset-top)); }
      .thought { font-size: 22px; }
      .controls { width: calc(100vw - 24px); justify-content: space-between; border-radius: 14px; }
      button { flex: 1; justify-content: center; padding: 0 8px; font-size: 12px; }
      .divider { display: none; }
    }
    @media (prefers-reduced-motion: reduce) { .toast { transition: none; } }
  </style>
</head>
<body>
  <canvas id="room" aria-label="An interactive three-dimensional moonlit reading nook with a rainy window, books, cushions, a warm lamp, and a sleeping cat"></canvas>
  <div class="grain" aria-hidden="true"></div>

    <p class="time">2:14 AM · WEATHER INSIDE: QUIET</p>

  </section>

  <div class="hint" aria-hidden="true">drag to look around<br>scroll to move closer</div>

    <button id="lamp" type="button" aria-pressed="true" aria-label="Turn reading lamp off">
      <svg class="glyph" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M9 18h6M10 22h4M8.6 15.4A7 7 0 1 1 15.4 15.4c-.8.7-1.3 1.5-1.4 2.6h-4c-.1-1.1-.6-1.9-1.4-2.6Z"/></svg>
      <span>Lamp</span>
    </button>
    <div class="divider" aria-hidden="true"></div>
    <button id="rain" type="button" aria-pressed="false" aria-label="Play quiet rain">
      <svg class="glyph" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M6.5 17.5A4.5 4.5 0 0 1 7 8.6 6 6 0 0 1 18.3 10 3.8 3.8 0 0 1 18 17.5"/><path d="m8 20 1-2M12 21l1-2M16 20l1-2"/></svg>
      <span>Rain</span>
    </button>
    <div class="divider" aria-hidden="true"></div>
    <button id="reset" type="button" aria-label="Reset the view">
      <svg class="glyph" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.3-5.7L4 8.6"/><path d="M4 4v4.6h4.6"/></svg>
      <span>Center</span>
    </button>
  </nav>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div class="fallback" id="fallback">The 3D room didn’t finish loading.</div>

    const blanket = box(2.18, .09, 1.5, mats.blanket, .83, 1.52, -1.5); blanket.rotation.z = -.035; blanket.rotation.y = -.08;
    const drape = box(1.95, 1.25, .10, mats.blanket, .86, .88, -.72); drape.rotation.z = -.08;
    for (let i = -2; i <= 2; i++) box(.025, 1.12, .115, new THREE.MeshLambertMaterial({color:0x704032}), .86 + i*.34, .88, -.65);

    const catBody = sphere(.48, mats.cat, 2.26, 1.72, -1.18, 1.55, .64, .78); catBody.rotation.z = -.08;
    sphere(.31, mats.cat, 2.83, 1.84, -1.17, 1, .94, 1);
    const earGeo = new THREE.ConeGeometry(.19, .42, 3);

    // Open book on the seat.

    const rightPage = box(.82, .035, .68, mats.paper, .1, 1.56, -1.0); rightPage.rotation.y = .12; rightPage.rotation.z = -.025;
    for (let i = 0; i < 4; i++) {
      box(.52,.012,.015,new THREE.MeshBasicMaterial({color:0x807467}),-.72,1.59,-1.2+i*.13,false,false);

    // Side table, books, mug.

    const steamMat = new THREE.MeshBasicMaterial({color:0xe8e3db,transparent:true,opacity:.25});
    const steam = [];
    for (let i=0;i<2;i++) {

    function positionCamera() {
      const cp = Math.cos(pitch), sp = Math.sin(pitch);

    }
    positionCamera();

    function resize() {
      renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 1.25));
      renderer.setSize(innerWidth, innerHeight, false);
      camera.aspect = innerWidth / innerHeight;
      camera.fov = innerWidth < 650 ? 48 : 43;
      camera.updateProjectionMatrix();
      if (!dragging && Math.abs(targetYaw) < .01 && Math.abs(targetPitch-.04) < .01) {
        targetDistance = innerWidth < 650 ? 17.2 : 13.1;
      }
    }
    addEventListener('resize', resize, {passive:true});

    canvas.addEventListener('pointerdown', function (e) { dragging=true; lastX=e.clientX; lastY=e.clientY; canvas.setPointerCapture(e.pointerId); });
    canvas.addEventListener('pointermove', function (e) {
      if(!dragging) return;
      targetYaw = Math.max(-.58, Math.min(.58, targetYaw - (e.clientX-lastX)*.005));
      targetPitch = Math.max(-.10, Math.min(.28, targetPitch + (e.clientY-lastY)*.004));
      lastX=e.clientX; lastY=e.clientY;
    });
    canvas.addEventListener('pointerup', function(){dragging=false;});
    canvas.addEventListener('pointercancel', function(){dragging=false;});
    canvas.addEventListener('wheel', function(e){e.preventDefault();targetDistance=Math.max(10.5,Math.min(innerWidth<650?20:16.5,targetDistance+e.deltaY*.008));},{passive:false});

    function showToast(message){toast.textContent=message;toast.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(function(){toast.classList.remove('show');},1800);}
    lampButton.addEventListener('click',function(){
      lampOn=!lampOn; lampLight.visible=lampOn; bulb.visible=lampOn; shadeMat.emissiveIntensity=lampOn?.75:.04;
      lampButton.setAttribute('aria-pressed',String(lampOn)); lampButton.setAttribute('aria-label',lampOn?'Turn reading lamp off':'Turn reading lamp on');
      showToast(lampOn?'A little warmth.':'Moonlight only.');
    });
    resetButton.addEventListener('click',function(){
      targetYaw=0; targetPitch=.04; targetDistance=innerWidth<650?17.2:13.1; showToast('Back to the window.');
    });

    function startRainAudio(){
      const AC=window.AudioContext||window.webkitAudioContext;if(!AC){showToast('Rain audio is not supported here.');return false;}
      if(!audio){
        const ac=new AC(),seconds=2,buffer=ac.createBuffer(2,ac.sampleRate*seconds,ac.sampleRate);
        for(let c=0;c<2;c++){const data=buffer.getChannelData(c);let last=0;for(let i=0;i<data.length;i++){const white=Math.random()*2-1;last=.985*last+.015*white;data[i]=(white-last)*.26+last*.18;}}
        const src=ac.createBufferSource();src.buffer=buffer;src.loop=true;
        const filter=ac.createBiquadFilter();filter.type='lowpass';filter.frequency.value=2600;filter.Q.value=.4;
        const gain=ac.createGain();gain.gain.value=0;src.connect(filter).connect(gain).connect(ac.destination);src.start();audio={ac:ac,src:src,gain:gain};
      }
      audio.ac.resume();audio.gain.gain.cancelScheduledValues(audio.ac.currentTime);audio.gain.gain.linearRampToValueAtTime(.24,audio.ac.currentTime+.6);return true;
    }

      if(!soundOn){if(startRainAudio()){soundOn=true;rainButton.setAttribute('aria-pressed','true');rainButton.setAttribute('aria-label','Mute quiet rain');showToast('Quiet rain is playing.');}}
      else{soundOn=false;audio.gain.gain.cancelScheduledValues(audio.ac.currentTime);audio.gain.gain.linearRampToValueAtTime(0,audio.ac.currentTime+.35);rainButton.setAttribute('aria-pressed','false');rainButton.setAttribute('aria-label','Play quiet rain');showToast('Rain muted.');}
    });
    addEventListener('keydown',function(e){
      if(e.key==='ArrowLeft')targetYaw=Math.min(.58,targetYaw+.06); if(e.key==='ArrowRight')targetYaw=Math.max(-.58,targetYaw-.06);

    });

    const clock = new THREE.Clock();
    function animate() {
      const t = clock.getElapsedTime();
      yaw += (targetYaw-yaw)*.075; pitch += (targetPitch-pitch)*.075; distance += (targetDistance-distance)*.075; positionCamera();
